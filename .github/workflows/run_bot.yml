name: 24-7 Lead Radar
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  send-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Radar Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          pip install requests
          python bot.py
